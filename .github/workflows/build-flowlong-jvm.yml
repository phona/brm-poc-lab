name: Build flowlong-app JVM image

on:
  push:
    branches: [main]
    paths:
      - 'flowlong-app/pom.xml'
      - 'flowlong-app/src/**'
      - 'flowlong-app/Dockerfile'
      - '.github/workflows/build-flowlong-jvm.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: '额外的稳定 tag（如 0.1.2 / 1.0.0）；留空则只打 jvm-<sha> 和 jvm-latest'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/flowlong-app

jobs:
  jvm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (用于本地 build 缓存依赖)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          TAGS="${{ env.IMAGE_NAME }}:jvm-${SHA_SHORT},${{ env.IMAGE_NAME }}:jvm-latest"
          if [ -n "${{ inputs.version_tag }}" ]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:${{ inputs.version_tag }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "main=${{ env.IMAGE_NAME }}:jvm-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "Tags: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push JVM image
        uses: docker/build-push-action@v6
        with:
          context: flowlong-app
          file: flowlong-app/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size & layers
        run: |
          docker pull ${{ steps.tags.outputs.main }}
          echo "=== Size ==="
          docker image inspect ${{ steps.tags.outputs.main }} --format '{{.Size}}' | numfmt --to=iec
          echo "=== Layers (top 10) ==="
          docker history ${{ steps.tags.outputs.main }} | head -11

      - name: Summary
        run: |
          {
            echo "## JVM image built ✅"
            echo ""
            echo "Tags:"
            for tag in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'); do
              echo "- \`${tag}\`"
            done
            echo ""
            echo "Pull:"
            echo '```bash'
            echo "docker pull ${{ steps.tags.outputs.main }}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18082
  description: Generated server url
tags:
- name: flowlong-app
  description: ttpos 审批引擎（FlowLong 1.2.4 包装）。Caller 负责预解析审批人 list，引擎对 ttpos 业务零认知。
- name: flowlong-app-process
  description: 流程定义管理接口。ttpos main 持有定义真源，通过 /process/deploy 同步到 FlowLong。
paths:
  /task/skip:
    post:
      tags:
      - flowlong-app
      summary: 审批通过任务
      description: caller 用 JSON body 传操作人 + variables。variables.approverIds 可指定下一节点审批人
        list（caller 预解析）。引擎按 task.actor_id 校验权限，不匹配会失败。
      operationId: skip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipRequest'
            example:
              taskId: 2056368596446793733
              userId: "10011"
              userName: Alice
              message: 同意
              variables:
                approverIds:
                - "10013"
                - "10014"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SkipResponse'
  /task/reject:
    post:
      tags:
      - flowlong-app
      summary: 驳回任务
      description: 默认退回上一节点；指定 rejectToNodeKey 退回到指定节点；terminate=true 时直接终止整个实例（业务'驳回'分支用）
      operationId: reject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RejectResponse'
  /process/deploy:
    post:
      tags:
      - flowlong-app-process
      summary: 部署 / 更新流程定义
      description: ttpos main 改完流程定义后调本接口推过来。repeat=true 时已存在则建新版本（老实例继续走老版本），repeat=false
        时已存在则跳过。
      operationId: deploy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployRequest'
            example:
              modelJson: "{\"key\":\"my_flow\",\"name\":\"我的流程\",\"type\":\"AUDIT\"\
                ,\"nodeConfig\":{...}}"
              repeat: true
              userId: system
              userName: system
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeployResponse'
  /instance/{instanceId}/terminate:
    post:
      tags:
      - flowlong-app
      summary: 强制终止实例
      description: 业务'驳回'分支或提交人主动撤回时调用。一旦终止不可恢复，老任务全部置完成。
      operationId: terminate
      parameters:
      - name: instanceId
        in: path
        description: 流程实例 ID
        required: true
        schema:
          type: integer
          format: int64
        example: 2056368596446793729
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SkipResponseLegacy'
  /flow/start:
    post:
      tags:
      - flowlong-app
      summary: 启动流程实例
      description: ttpos main 在用户提交单据时调用。caller 必须把审批人 list 预解析后通过 approverIds 或 approvers
        传过来，引擎不连 ttpos DB。
      operationId: start
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFlowRequest'
            examples:
              简单（仅 ID 列表）:
                description: 简单（仅 ID 列表）
                value:
                  userId: "10011"
                  userName: Alice
                  companyUuid: 1001
                  businessId: TR-001
                  approverIds:
                  - "10011"
                  - "10012"
              结构化（带显示名）:
                description: 结构化（带显示名）
                value:
                  userId: "10011"
                  userName: Alice
                  companyUuid: 1001
                  businessId: TR-002
                  approvers:
                  - id: "10011"
                    name: Alice
                  - id: "10012"
                    name: Bob
        required: true
      responses:
        "200":
          description: 成功
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StartFlowResponse'
  /task/todo:
    get:
      tags:
      - flowlong-app
      summary: 查某人的待办任务
      description: ttpos main 的审批中心 API 后端
      operationId: todo
      parameters:
      - name: userId
        in: query
        description: 操作人 staff_uuid
        required: true
        schema:
          type: string
        example: 10011
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: object
  /process/{processKey}:
    get:
      tags:
      - flowlong-app-process
      summary: 查指定 processKey 的最新版本定义
      description: 返回 model JSON 内容
      operationId: getByKey
      parameters:
      - name: processKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /process/list:
    get:
      tags:
      - flowlong-app-process
      summary: 列出所有流程定义
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessSummary'
  /instance/{instanceId}:
    get:
      tags:
      - flowlong-app
      summary: 查实例详情
      description: 返回实例当前状态 + 所有进行中的任务 + 任务的 actor
      operationId: getInstance
      parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InstanceDetail'
  /instance/{instanceId}/history:
    get:
      tags:
      - flowlong-app
      summary: 查实例历史 timeline
      description: ttpos Timeline 渲染数据源
      operationId: getHistory
      parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InstanceHistory'
  /instance/actors:
    get:
      tags:
      - flowlong-app
      summary: 查实例下所有任务的参与者（调试用）
      description: "推荐用 /instance/{id} 替代；本接口保留用于 debug 直查"
      operationId: actorsOfInstance
      parameters:
      - name: instanceId
        in: query
        description: 流程实例 ID
        required: true
        schema:
          type: integer
          format: int64
        example: 2056368596446793729
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: object
  /health:
    get:
      tags:
      - flowlong-app
      summary: Liveness 探针
      description: 返回 'ok' 字符串；K8s livenessProbe 用。生产建议改用 /actuator/health/liveness
      operationId: health
      responses:
        "200":
          description: ok
          content:
            text/plain:
              example: ok
components:
  schemas:
    SkipRequest:
      required:
      - taskId
      - userId
      type: object
      properties:
        taskId:
          type: integer
          description: 任务 ID（FlowLong 雪花 long）
          format: int64
          example: 2056368596446793733
        userId:
          type: string
          description: 操作人 staff_uuid
          example: "10011"
        userName:
          type: string
          description: 操作人显示名
          example: Alice
        message:
          type: string
          description: 审批意见
          example: 同意，符合采购规范
        variables:
          type: object
          additionalProperties:
            type: object
            description: 节点流转变量：可用 approverIds 指定下一节点审批人 list（caller 预解析后传入）。传 null
              时使用启动时已传的 approverIds。
          description: 节点流转变量：可用 approverIds 指定下一节点审批人 list（caller 预解析后传入）。传 null
            时使用启动时已传的 approverIds。
      description: 审批通过请求体。caller 可通过 variables.approverIds 指定下一节点的人
    SkipResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 引擎是否成功推进
          example: true
        currentNodeKey:
          type: string
          description: 操作后实例当前节点 key（流程结束则为 end）
          example: approve
        instanceState:
          type: integer
          description: 实例状态：0=审批中 1=审批通过 2=审批拒绝 3=撤销 5=终止
          format: int32
          example: 0
      description: 审批/通过任务返回
    RejectRequest:
      required:
      - reason
      - taskId
      - userId
      type: object
      properties:
        taskId:
          type: integer
          description: 任务 ID
          format: int64
          example: 2056368596446793733
        userId:
          type: string
          description: 操作人 staff_uuid
          example: "10011"
        userName:
          type: string
          description: 操作人显示名
          example: Alice
        reason:
          type: string
          description: 驳回原因（必填，业务规则）
          example: 金额不符，请修改
        rejectToNodeKey:
          type: string
          description: 驳回到指定节点 key（null/留空则驳回到上一节点）
          example: submit
        terminate:
          type: boolean
          description: 是否同时终止整个实例（true=终止，业务'驳回'分支用；false=仅退回前一节点，默认 false）
          example: false
      description: 驳回任务请求体
    ActorInfo:
      type: object
      properties:
        actorId:
          type: string
        actorName:
          type: string
        actorType:
          type: integer
          description: 0=用户 1=角色 2=部门
          format: int32
    RejectResponse:
      type: object
      properties:
        success:
          type: boolean
        activatedTasks:
          type: array
          description: 驳回后激活的任务列表（如果是退回上一节点会有新任务；如果是终止则为空）
          items:
            $ref: '#/components/schemas/TaskInfo'
        instanceState:
          type: integer
          description: 实例状态
          format: int32
          example: 0
      description: 驳回响应
    TaskInfo:
      type: object
      properties:
        taskId:
          type: string
        taskKey:
          type: string
        taskName:
          type: string
        taskType:
          type: integer
          description: 0=主办 1=审批 2=抄送 3=条件审批 ... 详见 flw_task.task_type
          format: int32
        performType:
          type: integer
          description: 0=发起 1=顺序 2=会签 3=或签 4=票签
          format: int32
        actors:
          type: array
          items:
            $ref: '#/components/schemas/ActorInfo'
      description: 任务及其参与者
    DeployRequest:
      required:
      - modelJson
      type: object
      properties:
        modelJson:
          type: string
          description: FlowLong 流程模型 JSON 字符串（按 flowlong 模型规范，详见 process-ttpos.json
            示例）
        repeat:
          type: boolean
          description: true=已存在时建新版本（推荐），false=已存在则跳过
          example: true
        userId:
          type: string
          description: 部署操作人 staff_uuid
          example: system
        userName:
          type: string
          description: 部署操作人显示名
          example: system
      description: 部署 / 更新流程定义。流程定义 JSON 模型由 ttpos main 持有，调本接口推送到 FlowLong。
    DeployResponse:
      type: object
      properties:
        processId:
          type: string
          description: FlowLong 内部 process ID（用于实例化时引用）
          example: "2056368515614023681"
        processKey:
          type: string
          description: 流程 key（业务唯一标识，从 modelJson 的 key 字段提取）
          example: ttpos_transfer_test
        processVersion:
          type: integer
          description: 流程版本（每次 repeat=true 部署自动 +1）
          format: int32
          example: 1
      description: 部署响应
    TerminateRequest:
      required:
      - userId
      type: object
      properties:
        userId:
          type: string
          description: 操作人 staff_uuid
          example: "10011"
        userName:
          type: string
          description: 操作人显示名
          example: Alice
        reason:
          type: string
          description: 终止原因（审计用）
          example: 提交人主动撤回
      description: 终止实例请求体（业务侧用于'驳回'分支强制结束流程）
    SkipResponseLegacy:
      type: object
      properties:
        success:
          type: boolean
      description: 审批/通过任务返回（兼容旧 query 调用形式）
    StartFlowRequest:
      required:
      - companyUuid
      - userId
      type: object
      properties:
        userId:
          type: string
          description: 发起人 ID（业务系统的 staff_uuid 字符串）
          example: "10011"
        userName:
          type: string
          description: 发起人显示名
          example: Alice
        companyUuid:
          type: integer
          description: 租户/公司 ID
          format: int64
          example: 1001
        businessId:
          type: string
          description: 业务单据号（订单号 / 调拨单号等），便于反查
          example: TR-20260519-001
        approverIds:
          type: array
          description: 审批人 ID 列表（简单形式，无显示名）；和 approvers 二选一
          example:
          - "10011"
          - "10012"
          items:
            type: string
            description: 审批人 ID 列表（简单形式，无显示名）；和 approvers 二选一
            example: "[\"10011\",\"10012\"]"
        approvers:
          type: array
          description: "审批人结构化列表（含显示名，方便审计），格式 [{id,name}]；和 approverIds 二选一"
          items:
            type: object
            additionalProperties:
              type: object
              description: "审批人结构化列表（含显示名，方便审计），格式 [{id,name}]；和 approverIds 二选一"
            description: "审批人结构化列表（含显示名，方便审计），格式 [{id,name}]；和 approverIds 二选一"
      description: 启动流程实例请求体。flowCode 在 PoC 中硬编码为 ttpos_transfer_test；approverIds
        或 approvers 二选一（caller 在调用前预解析好审批人列表）。
    StartFlowResponse:
      type: object
      properties:
        instanceId:
          type: string
          description: FlowLong 流程实例 ID（雪花 long 转字符串，避免 JS 大整数精度问题）
          example: "2056368596446793729"
        currentNodeKey:
          type: string
          description: 当前所在节点 key
          example: start
        currentNodeName:
          type: string
          description: 当前所在节点显示名
          example: 发起人
      description: 启动流程响应
    ProcessSummary:
      type: object
      properties:
        processId:
          type: string
        processKey:
          type: string
        processName:
          type: string
        processVersion:
          type: integer
          format: int32
        processState:
          type: integer
          description: 0=不可用 1=可用 2=历史版本
          format: int32
      description: 流程定义摘要
    InstanceDetail:
      type: object
      properties:
        instanceId:
          type: string
        processKey:
          type: string
        businessKey:
          type: string
          description: 业务单据号（启动时 caller 通过 businessId 字段传入）
          example: TR-20260519-001
        currentNodeKey:
          type: string
        currentNodeName:
          type: string
        instanceState:
          type: integer
          description: 0=审批中 1=通过 2=拒绝 3=撤销 4=超时 5=强制终止 6=自动通过 7=自动拒绝
          format: int32
        createTimeMs:
          type: integer
          description: 创建时间（Unix 毫秒）
          format: int64
        activeTasks:
          type: array
          description: 进行中的任务（已分配 actor）
          items:
            $ref: '#/components/schemas/TaskInfo'
        tenantId:
          type: string
          description: 租户/公司 ID（caller 启动时传入的 companyUuid）
          example: "1001"
      description: 实例当前状态 + 进行中任务的快照
    HistoryEntry:
      type: object
      properties:
        taskId:
          type: string
        taskKey:
          type: string
        taskName:
          type: string
        taskState:
          type: integer
          description: 0=活动 1=跳转 2=完成 3=拒绝 4=撤销 5=超时 6=终止 ...
          format: int32
        taskType:
          type: integer
          format: int32
        createTimeMs:
          type: integer
          format: int64
        finishTimeMs:
          type: integer
          format: int64
        durationMs:
          type: integer
          description: 处理耗时 ms
          format: int64
        actors:
          type: array
          items:
            $ref: '#/components/schemas/ActorInfo'
      description: 历史任务条目
    InstanceHistory:
      type: object
      properties:
        instanceId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
      description: 实例的历史任务时间线

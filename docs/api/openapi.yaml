openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18082
  description: Generated server url
tags:
- name: flowlong-app
  description: ttpos 审批引擎（FlowLong 1.2.4 包装）。Caller 负责预解析审批人 list，引擎对 ttpos 业务零认知。
paths:
  /task/skip:
    post:
      tags:
      - flowlong-app
      summary: 审批通过任务
      description: caller 传当前操作人 userId；引擎按 task.actor_id 校验权限，不匹配会失败
      operationId: skip
      parameters:
      - name: taskId
        in: query
        description: 任务 ID（FlowLong 雪花 long）
        required: true
        schema:
          type: integer
          format: int64
        example: 2056368596446793733
      - name: userId
        in: query
        description: 操作人 staff_uuid
        required: true
        schema:
          type: string
        example: 10011
      - name: userName
        in: query
        description: 操作人显示名
        required: false
        schema:
          type: string
          default: approver
        example: Alice
      responses:
        "200":
          description: "返回 {success: true/false}"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SkipResponse'
  /flow/start:
    post:
      tags:
      - flowlong-app
      summary: 启动流程实例
      description: ttpos main 在用户提交单据时调用。caller 必须把审批人 list 预解析后通过 approverIds 或 approvers
        传过来，引擎不连 ttpos DB。
      operationId: start
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFlowRequest'
            examples:
              简单（仅 ID 列表）:
                description: 简单（仅 ID 列表）
                value:
                  userId: "10011"
                  userName: Alice
                  companyUuid: 1001
                  businessId: TR-001
                  approverIds:
                  - "10011"
                  - "10012"
              结构化（带显示名）:
                description: 结构化（带显示名）
                value:
                  userId: "10011"
                  userName: Alice
                  companyUuid: 1001
                  businessId: TR-002
                  approvers:
                  - id: "10011"
                    name: Alice
                  - id: "10012"
                    name: Bob
        required: true
      responses:
        "200":
          description: 成功
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StartFlowResponse'
  /task/todo:
    get:
      tags:
      - flowlong-app
      summary: 查某人的待办任务
      description: ttpos main 的审批中心 API 后端
      operationId: todo
      parameters:
      - name: userId
        in: query
        description: 操作人 staff_uuid
        required: true
        schema:
          type: string
        example: 10011
      responses:
        "200":
          description: 待办列表，按创建时间倒序
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoRow'
  /instance/actors:
    get:
      tags:
      - flowlong-app
      summary: 查实例下所有任务的参与者
      description: 调试/审计用：列出实例当前所有任务以及每个任务被分配到的 actor
      operationId: actorsOfInstance
      parameters:
      - name: instanceId
        in: query
        description: 流程实例 ID
        required: true
        schema:
          type: integer
          format: int64
        example: 2056368596446793729
      responses:
        "200":
          description: 任务参与者列表（一人一行）
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceActorRow'
  /health:
    get:
      tags:
      - flowlong-app
      summary: Liveness 探针
      description: 返回 'ok' 字符串；K8s livenessProbe 用。生产建议改用 /actuator/health/liveness
      operationId: health
      responses:
        "200":
          description: ok
          content:
            text/plain:
              example: ok
components:
  schemas:
    SkipResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 引擎是否成功推进
          example: true
      description: 审批/通过任务返回
    StartFlowRequest:
      required:
      - companyUuid
      - userId
      type: object
      properties:
        userId:
          type: string
          description: 发起人 ID（业务系统的 staff_uuid 字符串）
          example: "10011"
        userName:
          type: string
          description: 发起人显示名
          example: Alice
        companyUuid:
          type: integer
          description: 租户/公司 ID
          format: int64
          example: 1001
        businessId:
          type: string
          description: 业务单据号（订单号 / 调拨单号等），便于反查
          example: TR-20260519-001
        approverIds:
          type: array
          description: 审批人 ID 列表（简单形式，无显示名）；和 approvers 二选一
          example:
          - "10011"
          - "10012"
          items:
            type: string
            description: 审批人 ID 列表（简单形式，无显示名）；和 approvers 二选一
            example: "[\"10011\",\"10012\"]"
        approvers:
          type: array
          description: "审批人结构化列表（含显示名，方便审计），格式 [{id,name}]；和 approverIds 二选一"
          items:
            type: object
            additionalProperties:
              type: object
              description: "审批人结构化列表（含显示名，方便审计），格式 [{id,name}]；和 approverIds 二选一"
            description: "审批人结构化列表（含显示名，方便审计），格式 [{id,name}]；和 approverIds 二选一"
      description: 启动流程实例请求体。flowCode 在 PoC 中硬编码为 ttpos_transfer_test；approverIds
        或 approvers 二选一（caller 在调用前预解析好审批人列表）。
    StartFlowResponse:
      type: object
      properties:
        instanceId:
          type: string
          description: FlowLong 流程实例 ID（雪花 long 转字符串，避免 JS 大整数精度问题）
          example: "2056368596446793729"
        currentNodeKey:
          type: string
          description: 当前所在节点 key
          example: start
        currentNodeName:
          type: string
          description: 当前所在节点显示名
          example: 发起人
      description: 启动流程响应
    TodoRow:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
          example: 2056368596446793733
        instanceId:
          type: integer
          description: 所属流程实例 ID
          format: int64
          example: 2056368596446793729
        taskName:
          type: string
          example: RBAC 审批 (会签)
        taskKey:
          type: string
          example: approve
        createTime:
          type: string
          description: 创建时间（Unix 秒级时间戳的字符串）
      description: 待办任务
    InstanceActorRow:
      type: object
      properties:
        taskId:
          type: integer
          description: 任务 ID（雪花 long）
          format: int64
          example: 2056368596446793733
        taskName:
          type: string
          example: RBAC 审批 (会签)
        taskKey:
          type: string
          example: approve
        actorId:
          type: string
          description: 参与者 ID（staff_uuid 字符串）
          example: "10011"
        actorName:
          type: string
          description: 参与者显示名
          example: Alice
        actorType:
          type: integer
          description: 0=用户 1=角色 2=部门
          format: int32
          example: 0
      description: 实例下任务及其参与者

server:
  port: 8082

spring:
  application:
    name: flowlong-poc
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/flowlong?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:pocroot}

flowlong:
  banner: true
  eventing:
    task: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # GraalVM Native: 显式指定 logger，避免运行时反射探测各种 log impl 类
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 可观测性：暴露 /actuator/health 和 /actuator/prometheus
# - health 给容器探针 + 部署侧探活
# - prometheus 给 GCP Managed Prometheus / 自建 Prom scrape
# 其它 actuator endpoint 默认不暴露（attack surface 最小化）
# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs               # JSON: /v3/api-docs    YAML: /v3/api-docs.yaml
  swagger-ui:
    path: /swagger-ui.html           # 浏览器入口
    operations-sorter: method
  info:
    title: flowlong-app API
    description: ttpos 审批引擎（FlowLong 1.2.4 包装）
    version: 0.1.1
    contact:
      name: ttpos team

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      service: flowlong-app
      env: ${DEPLOY_ENV:dev}

server:
  port: 8082

spring:
  application:
    name: flowlong-poc
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/flowlong?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:pocroot}

flowlong:
  banner: true
  eventing:
    task: true       # 启用 TaskEvent 发布到 Spring，给 EventBridge 接
    instance: true   # 启用 InstanceEvent 发布
  # RocketMQ 投递（唯一通道；系统未上线，无 webhook 后向兼容）。
  # 多 review env 场景：每个 env 用各自 tag 推消息（如 pr448 / prod），
  # ttpos 侧按 tag filter + 独立 consumer group 消费实现隔离。
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:true}
    name-server: ${ROCKETMQ_NAME_SERVER:}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:flowlong-app-producer}
    topic: ${ROCKETMQ_TOPIC:approval.flow.event}
    tag: ${ROCKETMQ_TAG:}
    access-key: ${ROCKETMQ_ACCESS_KEY:}
    secret-key: ${ROCKETMQ_SECRET_KEY:}
    send-timeout-ms: ${ROCKETMQ_SEND_TIMEOUT_MS:3000}
    retry-max: ${ROCKETMQ_RETRY_MAX:2}
    # 启动期建 topic（idempotent）。prod 应关闭并用 K8s pre-install Job + mqadmin
    # 显式建 topic，把 retention / 权限纳入 IaC；联调 / dev 保持 true 自动建。
    auto-create-topic: ${ROCKETMQ_AUTO_CREATE_TOPIC:true}
    queue-nums: ${ROCKETMQ_QUEUE_NUMS:4}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # GraalVM Native: 显式指定 logger，避免运行时反射探测各种 log impl 类
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 可观测性：暴露 /actuator/health 和 /actuator/prometheus
# - health 给容器探针 + 部署侧探活
# - prometheus 给 GCP Managed Prometheus / 自建 Prom scrape
# 其它 actuator endpoint 默认不暴露（attack surface 最小化）
# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs               # JSON: /v3/api-docs    YAML: /v3/api-docs.yaml
  swagger-ui:
    path: /swagger-ui.html           # 浏览器入口
    operations-sorter: method
  info:
    title: flowlong-app API
    description: ttpos 审批引擎（FlowLong 1.2.4 包装）
    version: 0.1.1
    contact:
      name: ttpos team

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      service: flowlong-app
      env: ${DEPLOY_ENV:dev}

server:
  port: 8082

spring:
  application:
    name: flowlong-poc
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/flowlong?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:pocroot}

flowlong:
  banner: true
  eventing:
    task: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

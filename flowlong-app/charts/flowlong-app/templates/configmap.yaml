apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flowlong-app.fullname" . }}-config
  labels:
    {{- include "flowlong-app.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      port: 8082
      shutdown: graceful
    spring:
      application:
        name: flowlong-poc
      lifecycle:
        timeout-per-shutdown-phase: 25s
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://{{ .Values.mysql.host }}:{{ .Values.mysql.port }}/{{ .Values.mysql.database }}?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: {{ .Values.mysql.username }}
        # password 由 env MYSQL_PASSWORD 注入（见 deployment.yaml），不写进 ConfigMap
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
    flowlong:
      banner: true
      eventing:
        task: true
        instance: true
      # RocketMQ：引擎事件投递唯一通道（vm04 联调起改造；无 webhook 后向兼容）。
      # access-key / secret-key 不进 ConfigMap，由 env 注入（见 deployment.yaml）。
      rocketmq:
        enabled: {{ .Values.rocketmq.enabled | default true }}
        name-server: {{ .Values.rocketmq.nameServer | default "" | quote }}
        producer-group: {{ .Values.rocketmq.producerGroup | default "flowlong-app-producer" | quote }}
        topic: {{ .Values.rocketmq.topic | default "approval.flow.event" | quote }}
        tag: {{ .Values.rocketmq.tag | default "" | quote }}
        send-timeout-ms: {{ .Values.rocketmq.sendTimeoutMs | default 3000 }}
        retry-max: {{ .Values.rocketmq.retryMax | default 2 }}
        auto-create-topic: {{ .Values.rocketmq.autoCreateTopic | default true }}
        queue-nums: {{ .Values.rocketmq.queueNums | default 4 }}
    mybatis-plus:
      configuration:
        map-underscore-to-camel-case: true
    # OpenAPI / Swagger
    springdoc:
      api-docs:
        path: /v3/api-docs
      swagger-ui:
        path: /swagger-ui.html
        operations-sorter: method

    # 可观测性：暴露 /actuator/health 和 /actuator/prometheus
    # health 给 K8s 探针，prometheus 给 GCP Managed Prometheus / 自建 Prom 抓取
    # 其它 actuator endpoint 不暴露（最小化攻击面）
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
          base-path: /actuator
      endpoint:
        health:
          probes:
            enabled: true
          show-details: never
      metrics:
        tags:
          service: flowlong-app
          env: {{ .Values.deployEnv | default "prod" }}

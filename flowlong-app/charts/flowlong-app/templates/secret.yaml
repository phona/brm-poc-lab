{{- /*
仅在没指定 existingSecret 时自动创建 — 仅供开发/测试。
生产强烈推荐用 existingSecret，通过 kubectl/Vault/SealedSecret 单独管理 DB 密码。
*/ -}}
{{- if and (not .Values.mysql.existingSecret) .Values.mysql.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowlong-app.dbSecretName" . }}
  labels:
    {{- include "flowlong-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.mysql.password | quote }}
{{- end }}
